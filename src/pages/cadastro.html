<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="cadastro" content="cadastro de usuario">
    <meta name="juliaKarol" content="VaiNaFe">
    <meta name="keywords" content="cadastro, usuario, senamora,relacioamento, namoro, amor, relacionamento amoroso">


    <title>Senamora-Cadastro</title>
</head>
<body>

    <h1> Cadastrar-se </h1>
    <p>Preencha os campos abaixo para criar sua conta.</p>
    
    <form action="/cadastrar" method="post"></form>
    <div class="input-nome">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="informe seu nome" required>
    </div>

    <div class="input-email">
        <label for="email">Email:</label>
        <input type="email" id="email" name="informe seu email" required>
    </div>

    <div class="input-senha">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="informe sua senha" required>
    </div>

</body>
</html>
